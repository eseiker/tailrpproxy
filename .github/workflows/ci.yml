name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify stable Tailscale pin
        run: ./hack/version.sh

  linux-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux ${{ matrix.arch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          rpp_version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            rpp_version=${GITHUB_REF_NAME#v}
          fi
          RPPROXY_VERSION="$rpp_version" \
            OUTPUT="dist/tailrpproxy-linux-${GOARCH}" RPPROXY_STRIP=1 \
            ./hack/build.sh
          if [[ "$GOARCH" == "amd64" ]]; then
            expected="tailrpproxy $(RPPROXY_VERSION="$rpp_version" ./hack/version.sh)"
            actual=$("dist/tailrpproxy-linux-${GOARCH}" -version)
            test "$actual" = "$expected"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tailrpproxy-linux-${{ matrix.arch }}
          path: dist/tailrpproxy-linux-${{ matrix.arch }}
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Resolve tailrpproxy version
        id: build-version
        run: |
          rpp_version=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            rpp_version=${GITHUB_REF_NAME#v}
          fi
          echo "rpp=$rpp_version" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RPPROXY_VERSION=${{ steps.build-version.outputs.rpp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - linux-binaries
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tailrpproxy-linux-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum tailrpproxy-linux-* > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease \
              --latest=false \
              --verify-tag
          fi
