name: Tag release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and print the tag without pushing it
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Create and validate tag
        id: tag
        run: |
          tag="v$(./hack/version.sh)"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null ||
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists; increment RPP_REVISION first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          ./hack/version.sh release "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Validated ${tag} at ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Push tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git push origin "refs/tags/${TAG}"
      - name: Dispatch release CI
        if: ${{ !inputs.dry_run }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run ci.yml --ref "$TAG"
          echo "Pushed ${TAG} and dispatched release CI" >> "$GITHUB_STEP_SUMMARY"
