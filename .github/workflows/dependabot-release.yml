name: Dependabot release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate, merge, tag, and dispatch release
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const allowedFiles = new Set(["go.mod", "go.sum", "RPP_REVISION"]);
            const requiredJobs = new Set([
              "test",
              "linux-binaries (amd64)",
              "linux-binaries (arm64)",
              "container",
            ]);

            const decode = (file) => Buffer.from(file.content, file.encoding).toString("utf8");
            const readFile = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(data) || data.type !== "file") {
                throw new Error(`${path} is not a file at ${ref}`);
              }
              return data;
            };
            const tailscaleVersion = (goMod) => {
              for (const line of goMod.split("\n")) {
                const match = line.match(/^\s*tailscale\.com\s+(v\d+\.\d+\.\d+)\s*(?:\/\/\s*(.*))?$/);
                if (match && !match[2]?.includes("indirect")) return match[1];
              }
              throw new Error("go.mod has no stable direct tailscale.com requirement");
            };
            const compareVersions = (a, b) => {
              const left = a.slice(1).split(".").map(Number);
              const right = b.slice(1).split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if (left[i] !== right[i]) return left[i] - right[i];
              }
              return 0;
            };

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              per_page: 100,
            });
            const summary = run.pull_requests?.[0];
            const candidate = openPulls.find((pull) =>
              pull.head.sha === run.head_sha &&
              (!summary || pull.number === summary.number)
            );
            if (!candidate) {
              core.info(`No open PR matches successful CI commit ${run.head_sha}; skipping.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: candidate.number,
            });
            if (pull.user.login !== "dependabot[bot]") {
              core.info(`PR #${pull.number} is not a Dependabot PR; skipping.`);
              return;
            }
            if (!/^dependabot\/go_modules\/tailscale\.com-/.test(pull.head.ref)) {
              core.info(`PR #${pull.number} is not a tailscale.com update; skipping.`);
              return;
            }
            if (pull.head.repo.full_name !== `${owner}/${repo}` || pull.base.ref !== "main") {
              throw new Error(`PR #${pull.number} does not use the expected repository and base branch`);
            }
            if (pull.draft || pull.head.sha !== run.head_sha) {
              throw new Error(`PR #${pull.number} is draft or moved after CI completed`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const unexpected = files.map((file) => file.filename)
              .filter((name) => !allowedFiles.has(name));
            if (!files.some((file) => file.filename === "go.mod") || unexpected.length > 0) {
              throw new Error(`PR #${pull.number} has unexpected files: ${unexpected.join(", ") || "missing go.mod"}`);
            }
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });
            const trustedAuthors = new Set(["dependabot[bot]", "github-actions[bot]"]);
            const untrustedCommit = commits.find((commit) =>
              !trustedAuthors.has(commit.author?.login)
            );
            if (untrustedCommit) {
              throw new Error(`PR #${pull.number} contains an untrusted commit: ${untrustedCommit.sha}`);
            }

            const baseVersion = tailscaleVersion(decode(await readFile("go.mod", pull.base.sha)));
            const nextVersion = tailscaleVersion(decode(await readFile("go.mod", pull.head.sha)));
            if (compareVersions(nextVersion, baseVersion) <= 0) {
              throw new Error(`Expected a Tailscale upgrade, got ${baseVersion} -> ${nextVersion}`);
            }

            const revisionFile = await readFile("RPP_REVISION", pull.head.sha);
            if (decode(revisionFile).trim() !== "1") {
              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pull.number,
              });
              if (current.head.sha !== run.head_sha) {
                throw new Error(`PR #${pull.number} moved before its revision could be reset`);
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: "RPP_REVISION",
                branch: pull.head.ref,
                sha: revisionFile.sha,
                message: `chore: reset rpp revision for ${nextVersion}`,
                content: Buffer.from("1\n").toString("base64"),
                author: {
                  name: "github-actions[bot]",
                  email: "41898282+github-actions[bot]@users.noreply.github.com",
                },
                committer: {
                  name: "github-actions[bot]",
                  email: "41898282+github-actions[bot]@users.noreply.github.com",
                },
              });
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "ci.yml",
                ref: pull.head.ref,
              });
              core.notice(`Reset PR #${pull.number} to rpp.1 and dispatched fresh CI.`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            for (const name of requiredJobs) {
              const job = jobs.find((item) => item.name === name);
              if (!job || job.conclusion !== "success") {
                throw new Error(`Required CI job ${name} did not succeed`);
              }
            }
            const ciJobNames = new Set(jobs.map((job) => job.name));

            const acceptable = new Set(["success", "neutral", "skipped"]);
            for (let attempt = 0; attempt < 30; attempt++) {
              const allChecks = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: pull.head.sha,
                filter: "latest",
                per_page: 100,
              });
              const checks = allChecks.filter((check) => !ciJobNames.has(check.name));
              const { data: statuses } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pull.head.sha,
              });
              const pending = checks.filter((check) => check.status !== "completed");
              const failed = checks.filter((check) =>
                check.status === "completed" && !acceptable.has(check.conclusion)
              );
              const statusPending = statuses.statuses.some((status) => status.state === "pending");
              const statusFailed = statuses.statuses.some((status) =>
                status.state === "error" || status.state === "failure"
              );
              if (failed.length > 0 || statusFailed) {
                throw new Error(`PR #${pull.number} has failed checks or commit statuses`);
              }
              if (pending.length === 0 && !statusPending) break;
              if (attempt === 29) throw new Error(`Timed out waiting for all PR #${pull.number} checks`);
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            const { data: latest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pull.number,
            });
            if (latest.head.sha !== run.head_sha || latest.mergeable === false) {
              throw new Error(`PR #${pull.number} moved or is not mergeable`);
            }
            const { data: merged } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              sha: run.head_sha,
              merge_method: "squash",
              commit_title: pull.title,
              commit_message: `Automated release for ${nextVersion}-rpp.1`,
            });
            if (!merged.merged) throw new Error(merged.message || `Could not merge PR #${pull.number}`);

            const tag = `${nextVersion}-rpp.1`;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              throw new Error(`Tag ${tag} already exists`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: annotation } = await github.rest.git.createTag({
              owner,
              repo,
              tag,
              message: tag,
              object: merged.sha,
              type: "commit",
              tagger: {
                name: "github-actions[bot]",
                email: "41898282+github-actions[bot]@users.noreply.github.com",
                date: new Date().toISOString(),
              },
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha: annotation.sha,
            });
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "ci.yml",
              ref: tag,
            });
            core.notice(`Merged PR #${pull.number}, created ${tag}, and dispatched release CI.`);
