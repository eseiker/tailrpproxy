name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify stable Tailscale pin
        run: |
          version=$(./hack/version.sh)
          expected="$(./hack/version.sh tailscale)-rpp.$(./hack/version.sh revision)"
          test "$version" = "$expected"
          if RPPROXY_REVISION=0 ./hack/version.sh >/dev/null 2>&1; then
            echo "revision 0 was accepted" >&2
            exit 1
          fi
          base=$(./hack/version.sh tailscale)
          RPPROXY_REVISION=1 RPPROXY_PREVIOUS_VERSION=v0.0.0-rpp.9 ./hack/version.sh release "v${base}-rpp.1"
          RPPROXY_REVISION=2 RPPROXY_PREVIOUS_VERSION="v${base}-rpp.1" ./hack/version.sh release "v${base}-rpp.2"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./hack/version.sh release "$GITHUB_REF_NAME"
          fi

  linux-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux ${{ matrix.arch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          OUTPUT="dist/tailrpproxy-linux-${GOARCH}" RPPROXY_STRIP=1 \
            ./hack/build.sh
          if [[ "$GOARCH" == "amd64" ]]; then
            expected="tailrpproxy $(./hack/version.sh)"
            actual=$("dist/tailrpproxy-linux-${GOARCH}" -version)
            test "$actual" = "$expected"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tailrpproxy-linux-${{ matrix.arch }}
          path: dist/tailrpproxy-linux-${{ matrix.arch }}
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - linux-binaries
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tailrpproxy-linux-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum tailrpproxy-linux-* > SHA256SUMS
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --prerelease=false --latest
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
